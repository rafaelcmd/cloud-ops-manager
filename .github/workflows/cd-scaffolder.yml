# =============================================================================
# PURPOSE   Builds the scaffolder (Step Functions task worker) image, pushes it
#           to ECR and rolls out the two Deployments that run it on the same EKS
#           cluster as the API: the state worker and the GitHub worker. One
#           image, two roles — see ADR-0004 and k8s/scaffolder/.
# TRIGGER   Manual (workflow_dispatch), or called by ops-platform-up.yml.
# AUTH      Shared `github-actions-deploy` role, via OIDC.
# EFFECT    MUTATES the cluster. Replaces the running scaffolder pods.
# REQUIRES  The `scaffolder` Terraform component, which owns this service's
#           IRSA ServiceAccounts, its DynamoDB table and both task queues, and
#           the Secrets Manager secret the GitHub worker reads its App key from.
#           Telemetry needs the OTel Collector Service in-cluster, so
#           orchestrated runs deploy the collector first.
# DOCS      .github/workflows/README.md
# =============================================================================

name: CD · Deploy Scaffolder → EKS

on:
  workflow_dispatch:
  workflow_call: {}

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-deploy
  EKS_CLUSTER_NAME: internal-developer-platform-cluster

# One deploy of this workload at a time, and never cancel one mid-rollout.
concurrency:
  group: deploy-scaffolder
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Scaffolder to EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assume AWS role
        uses: ./.github/actions/aws-oidc-login
        with:
          role-arn: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: ./.github/actions/ecr-login
        with:
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push image
        working-directory: services/scaffolder
        env:
          ECR_URL: ${{ steps.ecr.outputs.repository-url }}
        run: |
          docker build \
            --platform linux/amd64 \
            -f Dockerfile.dev \
            -t "$ECR_URL:scaffolder-latest" \
            -t "$ECR_URL:scaffolder-${{ github.sha }}" \
            .
          docker push "$ECR_URL:scaffolder-latest"
          docker push "$ECR_URL:scaffolder-${{ github.sha }}"

      # Immutable sha tag — see cd-api.yml for why the stable tag is not used.
      - name: Pin image in deployment manifest
        env:
          ECR_URL: ${{ steps.ecr.outputs.repository-url }}
        run: |
          sed -i "s|PLACEHOLDER-SCAFFOLDER-IMAGE|${ECR_URL}:scaffolder-${{ github.sha }}|g" \
            k8s/scaffolder/deployment.yaml \
            k8s/scaffolder/deployment-github.yaml

      - name: Configure kubectl
        uses: ./.github/actions/eks-kubeconfig
        with:
          cluster-name: ${{ env.EKS_CLUSTER_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply manifests
        run: kubectl apply -f k8s/scaffolder/

      # The sha-tagged image makes the apply itself start the rollout; these
      # steps only gate the job on both finishing. Both are waited on: a green
      # deploy that left the GitHub worker crash-looping would mean scaffold
      # requests reserve a name and then stall at CreateRepository.
      - name: Wait for state worker rollout
        run: kubectl rollout status deployment/internal-developer-platform-scaffolder-state -n default --timeout=10m

      - name: Wait for GitHub worker rollout
        run: kubectl rollout status deployment/internal-developer-platform-scaffolder-github -n default --timeout=10m
