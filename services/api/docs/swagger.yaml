openapi: 3.0.1
info:
  contact:
    email: team@internal-developer-platform.com
    name: Internal Developer Platform Team
  description: |
    The Internal Developer Platform Provisioner API provides endpoints for managing cloud resource provisioning requests.
    This API accepts provisioning requests and queues them for asynchronous processing via SQS.
    
    ## API Versioning
    This API uses path-based versioning (e.g., /v1/resources). Breaking changes will result in a new version.
    Deprecated endpoints will include `Deprecation` and `Sunset` headers in responses.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://internal-developer-platform.com/terms/
  title: Internal Developer Platform - Provisioner API
  version: 1.0.0
  x-api-version:
    current: ${api_version}
    supported:
      - ${api_version}
    deprecated: []
paths:
  /${api_version}/auth/signin:
    post:
      description: Authenticates a user and returns tokens
      requestBody:
        description: Sign in request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        "200":
          description: Authentication successful
          headers:
            X-Request-Id:
              description: Unique request identifier for tracing
              schema:
                type: string
            X-API-Version:
              description: API version that processed the request
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
        "400":
          description: Validation error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized - Invalid credentials
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Sign in
      tags:
      - auth
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: "${nlb_uri}/${api_version}/auth/signin"
        connectionType: VPC_LINK
        connectionId: "${vpc_link_id}"
        passthroughBehavior: when_no_match
        requestParameters:
          integration.request.header.X-Request-Id: context.requestId
  /${api_version}/auth/confirm:
    post:
      description: Confirms a user's sign up using the code sent by email
      requestBody:
        description: Confirm sign up request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmSignUpRequest'
      responses:
        "200":
          description: User confirmed successfully
          headers:
            X-Request-Id:
              description: Unique request identifier for tracing
              schema:
                type: string
            X-API-Version:
              description: API version that processed the request
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseEnvelope'
        "400":
          description: Validation error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Confirm sign up
      tags:
      - auth
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: "${nlb_uri}/${api_version}/auth/confirm"
        connectionType: VPC_LINK
        connectionId: "${vpc_link_id}"
        passthroughBehavior: when_no_match
        requestParameters:
          integration.request.header.X-Request-Id: context.requestId
  /${api_version}/auth/signup:
    post:
      description: Registers a new user with email and password
      requestBody:
        description: Sign up request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        "201":
          description: User created successfully
          headers:
            X-Request-Id:
              description: Unique request identifier for tracing
              schema:
                type: string
            X-API-Version:
              description: API version that processed the request
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResponseEnvelope'
        "400":
          description: Validation error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Sign up a new user
      tags:
      - auth
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: "${nlb_uri}/${api_version}/auth/signup"
        connectionType: VPC_LINK
        connectionId: "${vpc_link_id}"
        passthroughBehavior: when_no_match
        requestParameters:
          integration.request.header.X-Request-Id: context.requestId
  /${api_version}/health:
    get:
      description: Returns the health status of the API. Used for load balancer health checks and monitoring purposes.
      responses:
        "200":
          description: Service is healthy and operational
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/StringResponse'
      summary: Health check endpoint
      tags:
      - health
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "${nlb_uri}/${api_version}/health"
        connectionType: VPC_LINK
        connectionId: "${vpc_link_id}"
        passthroughBehavior: when_no_match
        requestParameters:
          integration.request.header.X-Request-Id: context.requestId
  /${api_version}/provision:
    post:
      description: |
        Submits a provision request to be processed asynchronously. One request carries both halves of
        the intent - the application to scaffold and the cloud resources it needs - because the
        resources' outputs end up in the application's repository. The provisioner splits them
        downstream. The request is validated and queued for processing via SQS.
      security:
      - CognitoAuthorizer: []
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: false
          description: |
            Client-generated UUIDv4 used to deduplicate retries. Reuse the same key when retrying
            a failed request to avoid double-publishing. Stored responses are replayed for 24 hours.
            Reusing a key with a different request body returns 422.
          schema:
            type: string
            format: uuid
      requestBody:
        description: Provision request - an application and the resources it needs
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionRequest'
      responses:
        "202":
          description: Request accepted for processing
          headers:
            X-Request-Id:
              description: Unique request identifier for tracing
              schema:
                type: string
            X-API-Version:
              description: API version that processed the request
              schema:
                type: string
            X-Idempotent-Replay:
              description: Present and set to "true" when this response was replayed from the idempotency cache.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponseEnvelope'
        "400":
          description: Validation error (includes malformed X-Idempotency-Key)
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized - Missing or invalid JWT token
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden - Insufficient permissions
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: |
            A request with this idempotency key is still being processed. Retry after a brief delay.
          headers:
            X-Request-Id:
              schema:
                type: string
            Retry-After:
              description: Suggested seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          description: |
            The X-Idempotency-Key was reused with a different request body. Use a new key.
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: Too Many Requests - Rate limit exceeded
          headers:
            X-Request-Id:
              schema:
                type: string
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Submit a provision request
      tags:
      - resources
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: "${nlb_uri}/${api_version}/provision"
        connectionType: VPC_LINK
        connectionId: "${vpc_link_id}"
        passthroughBehavior: when_no_match
        requestParameters:
          integration.request.header.X-Request-Id: context.requestId
  /${api_version}/swagger/{proxy+}:
    get:
      parameters:
      - name: proxy
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Swagger UI file
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/StringResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/StringResponse'
            application/javascript:
              schema:
                $ref: '#/components/schemas/StringResponse'
            text/css:
              schema:
                $ref: '#/components/schemas/StringResponse'
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "${nlb_uri}/${api_version}/swagger/{proxy}"
        connectionType: VPC_LINK
        connectionId: "${vpc_link_id}"
        passthroughBehavior: when_no_match
        requestParameters:
          integration.request.header.X-Request-Id: context.requestId
          integration.request.path.proxy: method.request.path.proxy
  /${api_version}/swagger:
    get:
      responses:
        "200":
          description: Swagger UI index
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/StringResponse'
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "${nlb_uri}/${api_version}/swagger"
        connectionType: VPC_LINK
        connectionId: "${vpc_link_id}"
        passthroughBehavior: when_no_match
        requestParameters:
          integration.request.header.X-Request-Id: context.requestId
tags:
- description: Resource provisioning operations
  name: resources
- description: Health check operations
  name: health
- description: Authentication operations
  name: auth

components:
  securitySchemes:
    CognitoAuthorizer:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
          - "${cognito_user_pool_arn}"
  schemas:
    StringResponse:
      type: object
      description: Simple string response wrapper for API Gateway compatibility
      properties:
        value:
          type: string
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        id_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
    ProvisionRequest:
      type: object
      description: |
        One developer asking the platform for an application: the repository to scaffold and the
        cloud resources it needs. request_id is assigned by the server and ignored if supplied -
        it keys the scaffolder's name reservation, so a caller able to choose it could adopt
        another caller's in-flight repository.
      required:
        - application
        - requested_by
      properties:
        application:
          $ref: '#/components/schemas/Application'
        resources:
          type: array
          description: Cloud resources to provision alongside the application. A service with no datastore is a valid golden path, so this may be omitted.
          maxItems: 20
          items:
            $ref: '#/components/schemas/Resource'
        requested_by:
          type: string
          description: Username or identifier of the person who requested it
          example: rafael
          minLength: 1
          maxLength: 100
    Application:
      type: object
      description: The repository half of a provision request
      required:
        - name
        - template
        - owner
      properties:
        name:
          type: string
          description: |
            Name of the application. Becomes a GitHub repository name, a Kubernetes object name and a
            DNS label, so it is validated against the strictest of the three: 3-40 characters,
            lowercase, starting with a letter, ending with a letter or digit, and containing only
            letters, digits and single hyphens.
          pattern: '^[a-z]([a-z0-9]|-[a-z0-9])*$'
          example: payments-api
          minLength: 3
          maxLength: 40
        template:
          type: string
          description: Golden path to scaffold from. The catalogue belongs to the scaffolder, so this is not a closed enum here.
          example: dotnet-consumer
          minLength: 1
          maxLength: 100
        owner:
          type: string
          description: Team or individual that will own the repository. Not the GitHub organization, which the scaffolder takes from its own configuration.
          example: team-payments
          minLength: 1
          maxLength: 100
        description:
          type: string
          description: Optional repository description. The scaffolder supplies a default when omitted.
          example: Payments processing service
          maxLength: 350
    Resource:
      type: object
      description: One cloud resource requested alongside an application
      required:
        - name
        - resource_type
        - cloud_provider
      properties:
        name:
          type: string
          description: Name of the resource within the application. Scoped to the request, so two applications can each have an "events" queue.
          example: payments-events
          minLength: 1
          maxLength: 100
        resource_type:
          type: string
          description: Type of cloud resource to provision
          enum:
            - DynamoDB
            - SQS
            - SNS
            - S3
            - RDS
            - VM
            - Lambda
            - VPC
            - ELB
          example: DynamoDB
        cloud_provider:
          type: string
          description: Cloud provider where the resource will be provisioned
          enum:
            - AWS
            - Azure
            - GCP
          example: AWS
        specification:
          type: object
          description: |
            Provider-specific configuration, interpreted by the infra worker according to
            resource_type. A map rather than free text: the worker reads individual settings
            rather than parsing a sentence.
          additionalProperties:
            type: string
          maxProperties: 30
          example:
            billing_mode: PAY_PER_REQUEST
    SignInRequest:
      type: object
      description: User authentication request
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: User's email address
          format: email
          maxLength: 254
          example: user@example.com
        password:
          type: string
          description: User's password
          minLength: 1
          maxLength: 128
          example: SecureP@ss123
    SignUpRequest:
      type: object
      description: User registration request
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: User's email address
          format: email
          maxLength: 254
          example: user@example.com
        password:
          type: string
          description: User's password (min 8 chars)
          minLength: 8
          maxLength: 128
          example: SecureP@ss123

    ConfirmSignUpRequest:
      type: object
      description: Sign-up confirmation request with verification code
      required:
        - email
        - confirmation_code
      properties:
        email:
          type: string
          description: User's email address
          format: email
          maxLength: 254
          example: user@example.com
        confirmation_code:
          type: string
          description: Confirmation code sent to user's email
          pattern: "^[a-zA-Z0-9]{6,10}$"
          minLength: 6
          maxLength: 10
          example: "123456"

    # ==========================================================================
    # ERROR RESPONSE SCHEMAS
    # Standardized error response structure (DVA-C02 best practice)
    # ==========================================================================
    ErrorResponse:
      type: object
      description: Standardized API error response
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code for programmatic handling
          enum:
            - VALIDATION_ERROR
            - INVALID_JSON
            - MISSING_HEADER
            - INTERNAL_ERROR
            - UNAUTHORIZED
            - NOT_FOUND
            - RATE_LIMITED
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable error message
          example: Request validation failed
        requestId:
          type: string
          description: Request ID for tracing
          example: abc123-def456
        details:
          type: array
          description: Detailed validation errors
          items:
            $ref: '#/components/schemas/ValidationError'

    ValidationError:
      type: object
      description: Individual field validation error
      properties:
        field:
          type: string
          description: Field name that failed validation
          example: email
        message:
          type: string
          description: Validation error message
          example: email must be a valid email address
        value:
          description: The invalid value that was provided
          example: invalid-email

    # ==========================================================================
    # API RESPONSE ENVELOPE SCHEMAS
    # Standardized response wrapper for consistent API responses
    # ==========================================================================
    ResponseMeta:
      type: object
      description: Metadata about the API response
      required:
        - timestamp
        - apiVersion
      properties:
        requestId:
          type: string
          description: Unique request identifier for tracing
          example: abc123-def456-ghi789
        timestamp:
          type: string
          format: date-time
          description: Response timestamp in RFC3339 format
          example: "2026-01-24T10:30:00Z"
        apiVersion:
          type: string
          description: API version that processed the request
          example: v1

    MessageResponse:
      type: object
      description: Simple success message response
      required:
        - message
      properties:
        message:
          type: string
          description: Success message
          example: Operation completed successfully
        status:
          type: string
          description: Operation status
          example: COMPLETED

    CreatedResponse:
      type: object
      description: Response for resource creation operations
      required:
        - message
        - status
      properties:
        message:
          type: string
          description: Success message
          example: User created successfully
        resourceId:
          type: string
          description: ID of the created resource
          example: user-12345
        status:
          type: string
          description: Creation status
          enum:
            - CREATED
            - PENDING
          example: CREATED

    AcceptedResponse:
      type: object
      description: Response for asynchronous operations (202 Accepted)
      required:
        - message
        - requestId
        - status
      properties:
        message:
          type: string
          description: Acceptance message
          example: Request accepted for processing
        requestId:
          type: string
          description: HTTP request identifier, for support and log lookup. Echoes X-Request-Id when the caller sends one.
          example: req-abc123
        provisionId:
          type: string
          format: uuid
          description: |
            The platform's correlation id for the queued work, and the only id that follows it
            downstream: it travels on the message, keys the scaffolder's name reservation, and
            names the state machine execution. Assigned by the server; a request_id in the body
            or an X-Request-Id header does not influence it.
          example: 88557ca2-36be-4296-b7fc-67aba5e07a2c
        status:
          type: string
          description: Request status
          enum:
            - ACCEPTED
            - QUEUED
          example: ACCEPTED
        trackUrl:
          type: string
          format: uri
          description: URL to track the request status
          example: /v1/requests/req-abc123/status

    # ==========================================================================
    # API RESPONSE ENVELOPE WRAPPERS
    # These wrap the response types in the standard APIResponse envelope
    # ==========================================================================
    AuthResponseEnvelope:
      type: object
      description: Wrapped authentication response
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/AuthResponse'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    MessageResponseEnvelope:
      type: object
      description: Wrapped message response
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/MessageResponse'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    CreatedResponseEnvelope:
      type: object
      description: Wrapped created response
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CreatedResponse'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    AcceptedResponseEnvelope:
      type: object
      description: Wrapped accepted response for async operations
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/AcceptedResponse'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
